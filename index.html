<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="暗闇カメラ">
  <meta name="theme-color" content="#000000">
  <title>暗闇カメラ - 発光ゼロ連続撮影</title>
  <!-- コード内蔵SVGアイコン（純黒背景＋三日月＆カメラファインダー） -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050508'/><circle cx='50' cy='50' r='28' fill='none' stroke='%232a3548' stroke-width='4'/><circle cx='50' cy='50' r='14' fill='%23121824'/><path d='M72 22 A10 10 0 1 0 82 32 A8 8 0 1 1 72 22 Z' fill='%23d4af37'/></svg>">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23050508'/><circle cx='50' cy='50' r='28' fill='none' stroke='%232a3548' stroke-width='4'/><circle cx='50' cy='50' r='14' fill='%23121824'/><path d='M72 22 A10 10 0 1 0 82 32 A8 8 0 1 1 72 22 Z' fill='%23d4af37'/></svg>">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #2b0808;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* 撮影メインエリア（全画面純黒） */
    #shoot-screen {
      position: fixed;
      inset: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top, 16px) + 12px) 16px calc(env(safe-area-inset-bottom, 16px) + 14px);
      z-index: 10;
    }

    /* 上部コントロールバー（極暗赤色） */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .dark-btn {
      background-color: #080000;
      color: #3d0c0c;
      border: 1px solid #1f0505;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .dark-btn:active {
      background-color: #140202;
      color: #5c1414;
    }

    /* 極小プレビュー枠（デフォルト非表示） */
    #preview-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 76px;
      height: 76px;
      border: 1px solid #220606;
      border-radius: 6px;
      overflow: hidden;
      display: none;
      pointer-events: none;
      opacity: 0.35;
    }

    #preview-wrapper.active {
      display: block;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 下部ステータス（極暗ドット＆枚数） */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #140202;
      transition: background-color 0.08s ease;
    }

    .status-dot.flash {
      background-color: #590d0d;
    }

    #shot-counter {
      color: #2e0808;
      font-weight: 600;
    }

    /* iOS Safari向け隠し触覚スイッチ */
    #haptic-container {
      position: fixed;
      top: -100px;
      left: -100px;
      opacity: 0.01;
      pointer-events: none;
    }

    /* 撮影後の確認・一括保存モーダル */
    #gallery-screen {
      position: fixed;
      inset: 0;
      background-color: #0b0b0e;
      color: #e2e8f0;
      z-index: 50;
      display: none;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 16px);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }

    #gallery-screen.open {
      display: flex;
    }

    .gallery-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }

    .gallery-header h2 {
      font-size: 16px;
      font-weight: 700;
    }

    .close-btn {
      background: #1e293b;
      color: #f8fafc;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .gallery-grid {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      align-content: start;
      -webkit-overflow-scrolling: touch;
    }

    .photo-card {
      position: relative;
      aspect-ratio: 3 / 4;
      background: #1e293b;
      border-radius: 8px;
      overflow: hidden;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .del-photo-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-footer {
      padding: 12px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 13px;
      border-radius: 10px;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-clear {
      background: #334155;
      color: #f1f5f9;
      flex: 0.45;
    }

    .btn-save {
      background: #2563eb;
      color: #ffffff;
    }

    .btn-save:disabled {
      background: #1e293b;
      color: #64748b;
    }

    .empty-msg {
      grid-column: 1 / -1;
      text-align: center;
      color: #64748b;
      padding: 48px 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- iOS Safari Taptic Engine 呼び出し用隠しスイッチ -->
  <div id="haptic-container" aria-hidden="true">
    <input type="checkbox" id="ios-haptic-switch" switch>
    <label for="ios-haptic-switch" id="ios-haptic-label"></label>
  </div>

  <!-- メイン純黒撮影画面 -->
  <div id="shoot-screen">
    <div class="top-bar">
      <button type="button" id="toggle-preview-btn" class="dark-btn">極小枠: OFF</button>
      <button type="button" id="open-gallery-btn" class="dark-btn">確認・保存 (0枚)</button>
    </div>

    <div id="preview-wrapper">
      <video id="video" autoplay playsinline muted></video>
    </div>

    <div class="bottom-bar">
      <div id="status-dot" class="status-dot"></div>
      <div id="shot-counter">SHOTS: 0</div>
    </div>
  </div>

  <!-- 撮影後の一覧・一括保存画面 -->
  <div id="gallery-screen">
    <div class="gallery-header">
      <h2 id="gallery-title">撮影済み一覧 (0枚)</h2>
      <button type="button" id="close-gallery-btn" class="close-btn">暗闇に戻る</button>
    </div>
    <div id="gallery-grid" class="gallery-grid"></div>
    <div class="gallery-footer">
      <button type="button" id="clear-all-btn" class="action-btn btn-clear">全削除</button>
      <button type="button" id="save-all-btn" class="action-btn btn-save">まとめて写真に保存</button>
    </div>
  </div>

  <canvas id="capture-canvas" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('capture-canvas');
    const shootScreen = document.getElementById('shoot-screen');
    const previewWrapper = document.getElementById('preview-wrapper');
    const togglePreviewBtn = document.getElementById('toggle-preview-btn');
    const openGalleryBtn = document.getElementById('open-gallery-btn');
    const closeGalleryBtn = document.getElementById('close-gallery-btn');
    const galleryScreen = document.getElementById('gallery-screen');
    const galleryGrid = document.getElementById('gallery-grid');
    const galleryTitle = document.getElementById('gallery-title');
    const saveAllBtn = document.getElementById('save-all-btn');
    const clearAllBtn = document.getElementById('clear-all-btn');
    const statusDot = document.getElementById('status-dot');
    const shotCounter = document.getElementById('shot-counter');
    const hapticLabel = document.getElementById('ios-haptic-label');

    let isPreviewOn = false;
    let isCapturing = false;
    let db = null;

    // 1. iPhone & Android 両対応の触覚フィードバック
    function triggerHaptic() {
      try {
        if (navigator.vibrate) {
          navigator.vibrate(35);
        }
        if (hapticLabel) {
          hapticLabel.click();
        }
      } catch (e) {}
    }

    // 2. IndexedDB 初期化（誤終了時の自動バックアップ用）
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('DarkNightCamDB', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('photos')) {
            database.createObjectStore('photos', { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => reject(e);
      });
    }

    function savePhotoToDB(blob) {
      return new Promise((resolve, reject) => {
        if (!db) return reject('DB not ready');
        const tx = db.transaction('photos', 'readwrite');
        const store = tx.objectStore('photos');
        const req = store.add({ blob, timestamp: Date.now() });
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function getAllPhotosFromDB() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction('photos', 'readonly');
        const store = tx.objectStore('photos');
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function deletePhotoFromDB(id) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function clearAllPhotosFromDB() {
      return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction('photos', 'readwrite');
        tx.objectStore('photos').clear();
        tx.oncomplete = () => resolve();
      });
    }

    async function updateCounters() {
      const items = await getAllPhotosFromDB();
      const count = items.length;
      openGalleryBtn.textContent = `確認・保存 (${count}枚)`;
      shotCounter.textContent = `SHOTS: ${count}`;
      galleryTitle.textContent = `撮影済み一覧 (${count}枚)`;
    }

    // 3. 背面カメラ起動
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 4032 },
            height: { ideal: 3024 }
          }
        });
        video.srcObject = stream;
      } catch (err) {
        alert('カメラへのアクセスを許可してください。');
      }
    }

    // 4. 発光ゼロ連続撮影処理
    async function takeSilentPhoto() {
      if (isCapturing || !video.videoWidth) return;
      isCapturing = true;

      // 触覚フィードバック＆極暗ドット点滅
      triggerHaptic();
      statusDot.classList.add('flash');
      setTimeout(() => statusDot.classList.remove('flash'), 120);

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (blob) {
          await savePhotoToDB(blob);
          await updateCounters();
        }
        isCapturing = false;
      }, 'image/jpeg', 0.95);
    }

    // 画面のどこをタップしても撮影（上部ボタンは除外）
    shootScreen.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      takeSilentPhoto();
    });

    // 極小枠の切替
    togglePreviewBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isPreviewOn = !isPreviewOn;
      previewWrapper.classList.toggle('active', isPreviewOn);
      togglePreviewBtn.textContent = isPreviewOn ? '極小枠: ON' : '極小枠: OFF';
    });

    // 確認・保存画面を開く
    openGalleryBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await renderGallery();
      galleryScreen.classList.add('open');
    });

    closeGalleryBtn.addEventListener('click', () => {
      galleryScreen.classList.remove('open');
    });

    // 一覧描画
    async function renderGallery() {
      const items = await getAllPhotosFromDB();
      await updateCounters();
      galleryGrid.innerHTML = '';

      if (items.length === 0) {
        galleryGrid.innerHTML = '<div class="empty-msg">まだ撮影された写真がありません。<br>暗闇画面をタップすると連続撮影できます。</div>';
        saveAllBtn.disabled = true;
        return;
      }

      saveAllBtn.disabled = false;
      items.forEach((item) => {
        const url = URL.createObjectURL(item.blob);
        const card = document.createElement('div');
        card.className = 'photo-card';

        const img = document.createElement('img');
        img.src = url;

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'del-photo-btn';
        delBtn.textContent = '×';
        delBtn.onclick = async () => {
          URL.revokeObjectURL(url);
          await deletePhotoFromDB(item.id);
          await renderGallery();
        };

        card.appendChild(img);
        card.appendChild(delBtn);
        galleryGrid.appendChild(card);
      });
    }

    // 一括で写真アプリ（共有シート）へ保存
    saveAllBtn.addEventListener('click', async () => {
      const items = await getAllPhotosFromDB();
      if (items.length === 0) return;

      const files = items.map((item, idx) => {
        const ts = new Date(item.timestamp).toISOString().replace(/[:.]/g, '-');
        return new File([item.blob], `night_${ts}_${idx + 1}.jpg`, { type: 'image/jpeg' });
      });

      if (navigator.canShare && navigator.canShare({ files })) {
        try {
          await navigator.share({
            files,
            title: '夜景撮影データ'
          });
        } catch (err) {
          // キャンセル時は何もしない
        }
      } else {
        // 非対応ブラウザ向けフォールバック（順次ダウンロード）
        files.forEach((file) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(file);
          a.download = file.name;
          a.click();
        });
      }
    });

    // 全削除
    clearAllBtn.addEventListener('click', async () => {
      if (!confirm('保存済みの写真をすべて削除しますか？')) return;
      await clearAllPhotosFromDB();
      await renderGallery();
    });

    // 起動時初期化
    (async () => {
      await initDB();
      await updateCounters();
      await startCamera();
    })();
  </script>
</body>
</html>
